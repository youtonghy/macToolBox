name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and draft release
    runs-on: macos-15
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        run: |
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || [[ "$VERSION" == DEV* ]] || [[ "$VERSION" == dev* ]]; then
            echo "Invalid or development version: $VERSION" >&2
            exit 1
          fi
          # Prefer numeric-ish build number for CFBundleVersion; fall back to run id.
          if [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "BUILD_NUMBER=$VERSION" >> "$GITHUB_ENV"
          else
            echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
          fi

      - name: Select latest Xcode
        run: |
          set -euo pipefail
          # Prefer the newest installed Xcode so objectVersion from current XcodeGen opens cleanly.
          XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$XCODE_APP" ]; then
            echo "No Xcode.app found under /Applications" >&2
            exit 1
          fi
          echo "Using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Install XcodeGen and uv
        run: |
          brew install xcodegen
          brew install uv

      - name: Import local signing certificate
        env:
          YOUTONGHY_P12: ${{ secrets.YOUTONGHY_P12 }}
          YOUTONGHY_P12_PASSWORD: ${{ secrets.YOUTONGHY_P12_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$YOUTONGHY_P12" ]] || { echo "missing YOUTONGHY_P12 secret for youtonghy signing" >&2; exit 1; }

          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT="$RUNNER_TEMP/cert.p12"

          printf '%s' "$YOUTONGHY_P12" | base64 --decode > "$CERT"
          [[ -s "$CERT" ]] || { echo "YOUTONGHY_P12 did not decode to a p12 file" >&2; exit 1; }

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # Default type is agg (cert + private key). `-t cert` drops the key
          # and leaves codesign with a certificate-only identity.
          security import "$CERT" \
            -P "${YOUTONGHY_P12_PASSWORD:-}" \
            -A \
            -f pkcs12 \
            -k "$KEYCHAIN" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productbuild
          rm -f "$CERT"

          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

          USER_KEYCHAINS="$(security list-keychains -d user | sed -E 's/^[[:space:]]*"//;s/"[[:space:]]*$//')"
          security list-keychains -d user -s "$KEYCHAIN" $USER_KEYCHAINS
          security default-keychain -d user -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "Imported codesigning identities:"
          security find-identity -v -p codesigning
          if ! security find-identity -v -p codesigning | grep -Eq '[[:xdigit:]]{40} "youtonghy"$'; then
            echo "error: imported p12 does not contain a codesigning identity named youtonghy" >&2
            exit 1
          fi

      - name: Bootstrap OCR worker runtime
        run: ./scripts/bootstrap_ocr_worker_runtime.sh --bootstrap

      - name: Verify tests and audio routing build gates
        run: ./scripts/verify-audio-routing-build.sh

      - name: Build app
        env:
          OPEN: "0"
          SKIP_INSTALL: "1"
          CODE_SIGN_IDENTITY: "youtonghy"
        run: ./build.sh

      - name: Package app + dmg
        env:
          APP_PATH: build/Build/Products/Release/ToolBox.app
          OUT_DIR: dist
          REQUIRE_NOTARIZED: "0"
        run: ./scripts/package-release.sh

      - name: Collect commits since last release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          LAST_TAG="$(
            gh release list \
              --exclude-drafts \
              --limit 1 \
              --json tagName \
              --jq '.[0].tagName // empty'
          )"

          if [ -n "$LAST_TAG" ]; then
            echo "Previous release tag: $LAST_TAG"
            COMMITS="$(git log "${LAST_TAG}..HEAD" --pretty=format:'- %s' --no-merges || true)"
          else
            echo "No previous release found; using full history"
            COMMITS="$(git log --pretty=format:'- %s' --no-merges || true)"
          fi

          {
            echo "### Changes"
            echo
            if [ -n "$COMMITS" ]; then
              printf '%s\n' "$COMMITS"
            else
              echo "- No commits since last release"
            fi
            echo
          } | tee release-notes.md

      - name: Generate SBOM
        run: ./scripts/generate_sbom.sh "$GITHUB_WORKSPACE/sbom.cdx.json"

      - name: Clean temporary keychain
        if: always()
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          TITLE="ToolBox ${VERSION}"

          # Replace existing draft with the same tag if present.
          if gh release view "$TAG" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
            if [ "$IS_DRAFT" = "true" ]; then
              echo "Deleting existing draft release $TAG"
              gh release delete "$TAG" --yes --cleanup-tag
            else
              echo "Release $TAG already exists and is not a draft" >&2
              exit 1
            fi
          fi

          gh release create "$TAG" \
            --draft \
            --title "$TITLE" \
            --notes-file release-notes.md \
            "dist/ToolBox-${VERSION}.app.zip" \
            "dist/ToolBox-${VERSION}.dmg" \
            "sbom.cdx.json"
