name: ToolBox
options:
  bundleIdPrefix: com.youtonghy
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "DEV0.0.0"
    CURRENT_PROJECT_VERSION: "0"
    ALWAYS_SEARCH_USER_PATHS: NO

targets:
  ToolBox:
    type: application
    platform: macOS
    sources:
      - Sources/ToolBox
    dependencies:
      - sdk: CoreDisplay.framework
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: ToolBox
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.youtonghy.toolbox
        PRODUCT_NAME: ToolBox
        CODE_SIGN_ENTITLEMENTS: Resources/ToolBox.entitlements
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_OBJC_BRIDGING_HEADER: Sources/ToolBox/DisplayControl/Darwin/DisplayControlBridgingHeader.h
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - /System/Library/Frameworks

  ToolBoxTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/ToolBoxTests
    dependencies:
      - target: ToolBox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.youtonghy.toolbox.tests
        GENERATE_INFOPLIST_FILE: YES
