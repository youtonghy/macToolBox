name: ToolBox
options:
  bundleIdPrefix: com.youtonghy
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  ArgumentParser:
    url: https://github.com/apple/swift-argument-parser.git
    exactVersion: 1.7.0
  Yams:
    url: https://github.com/jpsim/Yams.git
    exactVersion: 5.0.6

settings:
  base:
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "DEV0.0.0"
    CURRENT_PROJECT_VERSION: "0"
    ALWAYS_SEARCH_USER_PATHS: NO
    # The bundled ONNX Runtime release is Apple Silicon-only. Keep every
    # target on the same architecture so Release does not attempt an
    # unsupported x86_64 link.
    ARCHS: arm64

targets:
  ToolBox:
    type: application
    platform: macOS
    sources:
      - Sources/ToolBox/ToolBoxApp.swift
      - path: Sources/ToolBoxOCRWorker
        buildPhase: resources
        type: folder
      - path: .build/ocr-worker-runtime
        buildPhase: resources
        type: folder
      - Resources/Assets.xcassets
      - path: Resources/en.lproj
        buildPhase: resources
      - path: Resources/zh-Hans.lproj
        buildPhase: resources
      - path: Resources/zh-Hant.lproj
        buildPhase: resources
      - path: Resources/OCRModels
        buildPhase: resources
    dependencies:
      - target: ToolBoxCore
      - target: ToolBoxControlProtocol
      - target: ToolBoxCLI
        link: false
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - framework: .build/ocr-runtime/lib/libonnxruntime.1.24.3.dylib
        embed: true
        codeSign: true
      - sdk: CoreDisplay.framework
      - sdk: CoreAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreWLAN.framework
      - sdk: Security.framework
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: ToolBox
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - zh-Hans
          - zh-Hant
        # Helps TCC surface a proper Input Monitoring purpose string and list entry.
        NSInputMonitoringUsageDescription: "ToolBox 需要输入监控权限，以便拦截亮度 / 音量媒体键并转发给外接显示器。"
        NSAudioCaptureUsageDescription: "ToolBox 需要系统音频捕获权限，以便为不同应用调整音量并路由到指定输出设备。"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.youtonghy.toolbox
        PRODUCT_NAME: ToolBox
        DEFINES_MODULE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Xcode launches use ad-hoc signing by default; production signing overrides this in build.sh.
        CODE_SIGN_ENTITLEMENTS: Resources/ToolBox-AdHoc.entitlements
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/.build/ocr-runtime/lib"
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - /System/Library/Frameworks
    scheme:
      testTargets:
        - ToolBoxTests
        - ToolBoxCLITests
  ToolBoxCore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/ToolBox
        excludes:
          - ToolBoxApp.swift
    dependencies:
      - target: ToolBoxControlProtocol
      - package: Yams
      - framework: .build/ocr-runtime/lib/libonnxruntime.1.24.3.dylib
      - sdk: CoreDisplay.framework
      - sdk: CoreAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreWLAN.framework
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.youtonghy.toolbox.core
        PRODUCT_NAME: ToolBoxCore
        DEFINES_MODULE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/ToolBox/DisplayControl/Darwin/DisplayControlBridgingHeader.h
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/.build/ocr-runtime/include"
          - "$(PROJECT_DIR)/Sources/ToolBox/OCR/Runtime"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/.build/ocr-runtime/lib"
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - /System/Library/Frameworks
  ToolBoxCLI:
    type: tool
    platform: macOS
    sources:
      - Sources/ToolBoxCLI
    dependencies:
      - target: ToolBoxControlProtocol
      - package: ArgumentParser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.youtonghy.toolbox.cli
        PRODUCT_NAME: toolbox
        CODE_SIGN_ENTITLEMENTS: Resources/ToolBoxCLI.entitlements
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_HARDENED_RUNTIME: YES
  ToolBoxControlProtocol:
    type: library.static
    platform: macOS
    sources:
      - Sources/ToolBoxControlProtocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.youtonghy.toolbox.control-protocol
        PRODUCT_NAME: ToolBoxControlProtocol
        MACOSX_DEPLOYMENT_TARGET: "14.0"
  ToolBoxTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/ToolBoxTests
    dependencies:
      - target: ToolBox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.youtonghy.toolbox.tests
        GENERATE_INFOPLIST_FILE: YES
  ToolBoxCLITests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/ToolBoxCLITests
      - path: Sources/ToolBoxCLI
        excludes:
          - Main.swift
    dependencies:
      - target: ToolBoxControlProtocol
      - package: ArgumentParser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.youtonghy.toolbox.cli.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ToolBoxCLI:
    build:
      targets:
        ToolBoxCLI: all
    test:
      targets:
        - name: ToolBoxCLITests
          parallelizable: true
          randomExecutionOrder: false
